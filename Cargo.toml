# Standalone crate (its own git submodule); not part of any host workspace.
[workspace]

[package]
name = "zdbview"
version = "0.12.0"
edition = "2021"
description = "Terminal inspector and CRUD editor for rkyv archives and SQLite databases"
authors = ["MenkeTechnologies <linux.dev25@gmail.com>"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/zdbview"
homepage = "https://menketechnologies.github.io/zdbview"
documentation = "https://docs.rs/zdbview"
readme = "README.md"
keywords = ["sqlite", "rkyv", "tui", "database", "viewer"]
categories = ["command-line-utilities", "database"]
# Dev-only assets: not part of the published crate.
exclude = ["/docs", "/screenshots"]

[[bin]]
name = "zdbview"
path = "src/main.rs"

[features]
# Bytecode disassembly of fusevm::Chunk value blobs, on by default (fusevm is
# published on crates.io, so this stays self-contained and publishable).
default = ["disasm"]
disasm = ["dep:fusevm", "dep:bincode"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
# `load_extension` is DB Browser's "Load Extension": SQLite's own extension
# loading, off by default in the C library and behind this feature in rusqlite.
rusqlite = { version = "0.40", features = ["bundled", "hooks", "load_extension"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Pinned to match the rkyv version + features zshrs serializes its shards with,
# so recognized archives validate byte-for-byte.
rkyv = { version = "0.7", features = ["validation", "archive_le", "size_32"] }
# disasm feature only: the real fusevm bytecode types (no vendored copy of the
# Op enum, whose variant list grows every release, so no drift risk) + bincode to
# decode the blobs.
fusevm = { version = "0.25.0", default-features = false, optional = true }
bincode = { version = "1", optional = true }

[profile.release]
lto = true
strip = true
